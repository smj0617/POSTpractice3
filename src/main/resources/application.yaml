spring:
  application:
    name: POSTpractice3
  # ---------- [002 추가] 여기부터 ----------
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL # 프로젝트 폴더에 db_dev.mv.db 파일로 DB 저장
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console 에서 DB 내용 확인 가능
  jpa:
    show-sql: true # 실행되는 SQL을 콘솔에 출력
    hibernate:
      ddl-auto: update # 엔티티 클래스를 보고 테이블을 자동으로 만들어 줌
    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 줄바꿈
  # ---------- [002 추가] 여기까지 ----------
